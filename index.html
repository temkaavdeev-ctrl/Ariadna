<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ариадна</title>
<meta name="description" content="Ариадна — нить через лабиринт. Личная автономная команда: память, планы, приоритеты, забота.">
<style>
  :root{
    --bg:#faf8f5; --ink:#2b2723; --muted:#8a8078; --thread:#b0443c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171512; --ink:#e8e2da; --muted:#8a8078; --thread:#d4756c; }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    min-height:100svh; display:grid; place-items:center; text-align:center;
  }
  main{padding:2rem; max-width:34rem}
  .thread{
    display:block; margin:0 auto 2.2rem; width:120px; height:120px;
  }
  h1{font-size:2.4rem; font-weight:normal; letter-spacing:.06em}
  p.tag{margin-top:.9rem; color:var(--muted); font-style:italic; line-height:1.6}
  p.status{margin-top:2.4rem; font-size:.85rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
</style>
</head>
<body>
<main>
  <svg class="thread" viewBox="0 0 120 120" fill="none" aria-hidden="true">
    <path d="M60 8 A52 52 0 1 1 59.9 8 M60 24 A36 36 0 1 0 60.1 24 M60 40 A20 20 0 1 1 59.9 40"
          stroke="var(--thread)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="4" fill="var(--thread)"/>
  </svg>
  <h1>Ариадна</h1>
  <p class="tag">Нить через лабиринт.<br>Память, планы, приоритеты, забота.</p>
  <p class="status">строится изнутри · 2026</p>
</main>
</body>
</html>
