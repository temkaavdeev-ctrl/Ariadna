<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ариадна</title>
<style>
  :root{
    --bg:#0d0f1a;
    --card:#141728;
    --gold:#d4a54a;
    --gold-l:#f0cd7e;
    --text:#e8e4d8;
    --muted:#8a8fa3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{overflow-x:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100svh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  /* тихое золотое дыхание в глубине сцены */
  body::before{
    content:"";
    position:fixed;
    left:50%;top:44%;
    width:min(130vw,760px);
    height:min(130vw,760px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(212,165,74,.10) 0%,rgba(212,165,74,.04) 34%,transparent 62%);
    pointer-events:none;
    z-index:0;
    animation:ambient 12s ease-in-out infinite;
  }
  @keyframes ambient{
    0%,100%{opacity:.6}
    50%{opacity:1}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg,#161a2e 0%,var(--card) 100%);
    border:1px solid rgba(212,165,74,.16);
    border-radius:24px;
    padding:clamp(40px,7vw,52px) clamp(28px,6vw,36px) clamp(34px,6vw,40px);
    text-align:center;
    box-shadow:
      0 1px 0 rgba(240,205,126,.06) inset,
      0 36px 84px -34px rgba(0,0,0,.8);
  }

  /* ——— нить ——— */
  .thread{
    width:clamp(140px,40vw,168px);
    height:clamp(140px,40vw,168px);
    margin:0 auto clamp(26px,5vw,32px);
    display:block;
    overflow:visible;
    filter:drop-shadow(0 0 14px rgba(212,165,74,.22));
  }
  /* очень медленное вращение клубка */
  .spin{
    transform-origin:52px 52px;
    animation:spin 60s linear infinite;
  }
  /* дыхание поверх вращения */
  .breathe{
    transform-origin:52px 52px;
    animation:breathe 8s ease-in-out infinite;
  }
  .line{opacity:.94}
  /* одна мягкая искра, бегущая по всей нити */
  .spark{
    stroke:var(--gold-l);
    stroke-width:2.8;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray:6 620;
    filter:drop-shadow(0 0 5px rgba(240,205,126,.9));
    animation:travel 9s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.92}
    50%{transform:scale(1.035);opacity:1}
  }
  @keyframes travel{
    0%{stroke-dashoffset:626;opacity:0}
    8%{opacity:1}
    82%{opacity:1}
    90%,100%{stroke-dashoffset:0;opacity:0}
  }

  /* ——— типографика ——— */
  .eyebrow{
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
    font-size:11px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
    padding-left:.42em;
  }
  .name{
    font-weight:400;
    font-size:clamp(38px,12vw,54px);
    line-height:1;
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--gold-l);
    margin-bottom:20px;
  }
  .rule{
    width:38px;height:1px;
    margin:0 auto 20px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.75;
  }
  .verse{
    font-size:clamp(16px,4.4vw,18px);
    line-height:1.6;
    color:var(--text);
    font-style:italic;
    max-width:22ch;
    margin:0 auto;
  }
  .verse .em{
    color:var(--gold-l);
    font-style:normal;
  }
  .sub{
    margin-top:22px;
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @media (max-width:360px){
    .card{padding:38px 26px 32px}
    .name{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){
    .spin,.breathe,.spark,body::before{animation:none!important}
    .spark{opacity:0}
    body::before{opacity:.85}
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="thread" viewBox="0 0 104 104" role="img" aria-label="Нить Ариадны">
      <g class="breathe">
        <g class="spin">
          <path class="line"
            d="M52 52 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 0 5 -5 a9 9 0 1 1 -9 9 a13.5 13.5 0 1 0 13.5 -13.5 a19 19 0 1 1 -19 19 a25.5 25.5 0 1 0 25.5 -25.5 a33 33 0 1 1 -33 33"
            stroke="#d4a54a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path class="spark"
            d="M52 52 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 0 5 -5 a9 9 0 1 1 -9 9 a13.5 13.5 0 1 0 13.5 -13.5 a19 19 0 1 1 -19 19 a25.5 25.5 0 1 0 25.5 -25.5 a33 33 0 1 1 -33 33"/>
        </g>
      </g>
    </svg>

    <p class="eyebrow">Второй ты</p>
    <h1 class="name">Ариадна</h1>
    <div class="rule"></div>
    <p class="verse">Держись за нить&nbsp;— и тьма перестанет быть <span class="em">лабиринтом</span>.</p>
    <p class="sub">Помнит&nbsp;&middot;&nbsp;Живёт&nbsp;&middot;&nbsp;Рядом</p>
  </main>
</body>
</html>
